name: Build and release the Dagu rootfs

on:
  push:
    branches: [debian]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      build_id:
        description: "Release tag to publish, for example v20261101-120000"
        required: false

concurrency:
  group: rootfs-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      build_id: ${{ steps.meta.outputs.build_id }}
    steps:
      - name: Resolve build id
        id: meta
        run: |
          if [ -n "${{ github.event.inputs.build_id }}" ]; then
            echo "build_id=${{ github.event.inputs.build_id }}" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "build_id=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "build_id=v$(date +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: meta
    runs-on: ubuntu-24.04-arm
    env:
      TEMPLATE: Dagu-KDE
    steps:
      - uses: actions/checkout@v4

      - name: Install docker and CLI
        run: |
          missing=""
          for tool in docker jq xz; do
            command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
          done
          if [ -n "$missing" ]; then
            sudo apt-get update
            sudo apt-get install -y docker.io jq xz-utils
          fi
          if ! docker buildx version >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y docker-buildx
          fi
          sudo systemctl start docker 2>/dev/null || true
          docker version
          docker buildx version

      - name: Build rootfs
        run: ./build.sh -a aarch64 -i "$TEMPLATE" -v "${{ needs.meta.outputs.build_id }}"

      - uses: actions/upload-artifact@v4
        with:
          name: rootfs-Dagu-KDE
          path: "*.tar.xz"
          retention-days: 3
          if-no-files-found: error

  release:
    needs: [meta, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: rootfs-*
          merge-multiple: true
          path: assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.build_id }}
          name: Dagu KDE rootfs ${{ needs.meta.outputs.build_id }}
          files: assets/*.tar.xz
          body: |
            Droidspaces rootfs image for the Xiaomi Pad 5 Pro 12.4.

            - `Dagu-KDE-*`: Debian 13 + KDE Plasma 6.7 on Termux:X11 with Mesa/kgsl.

            Import the tarball as a container rootfs; see README for the container options.

      - name: Regenerate rootfs.json
        run: |
          python3 scripts/generate_rootfs_json.py \
            --assets assets \
            --repo "${{ github.repository }}" \
            --tag "${{ needs.meta.outputs.build_id }}"

      - name: Commit rootfs.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rootfs.json
          git diff --cached --quiet && { echo "rootfs.json unchanged"; exit 0; }
          if [ "${GITHUB_REF_TYPE}" = "branch" ]; then
            target="${GITHUB_REF_NAME}"
          else
            target="main"
          fi
          git commit -m "chore: update rootfs.json for ${{ needs.meta.outputs.build_id }}"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "$target" || true
            if git push origin "HEAD:${target}"; then exit 0; fi
            sleep 5
          done
          exit 1
