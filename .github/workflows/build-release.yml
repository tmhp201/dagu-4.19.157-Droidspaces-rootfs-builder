name: Build and release the Dagu rootfs

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      build_id:
        description: "Release tag to publish, for example v20261101-120000"
        required: false

concurrency:
  group: rootfs-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    outputs:
      build_id: ${{ steps.meta.outputs.build_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve build id
        id: meta
        run: |
          if [ -n "${{ github.event.inputs.build_id }}" ]; then
            echo "build_id=${{ github.event.inputs.build_id }}" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "build_id=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "build_id=v$(date +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"
          fi

      - name: Build rootfs
        run: ./build.sh -a aarch64 -i Dagu-GNOME -v "${{ steps.meta.outputs.build_id }}"

      - uses: actions/upload-artifact@v4
        with:
          name: rootfs
          path: "*.tar.xz"
          retention-days: 3
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rootfs
          path: assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.build_id }}
          name: Dagu rootfs ${{ needs.build.outputs.build_id }}
          files: assets/*.tar.xz
          body: |
            Debian 13 KDE rootfs for Droidspaces on the Xiaomi Pad 5 Pro 12.4.
            Import the tarball as a container rootfs; see README for the container options.

      - name: Regenerate rootfs.json
        run: |
          python3 scripts/generate_rootfs_json.py \
            --assets assets \
            --repo "${{ github.repository }}" \
            --tag "${{ needs.build.outputs.build_id }}"

      - name: Commit rootfs.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rootfs.json
          git diff --cached --quiet && { echo "rootfs.json unchanged"; exit 0; }
          git commit -m "chore: update rootfs.json for ${{ needs.build.outputs.build_id }}"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main || true
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
